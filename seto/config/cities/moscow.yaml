# Москва — город разработки.
# Роли городов утверждаются человеком по отчёту profile-cities (Л8), пока черновик.

name: moscow
title: "Москва"
role: dev                    # dev | test | reserve

boundary:
  source: osm_relation
  relation_id: 2555133       # Москва, проверить admin_level при загрузке
  admin_level: 4

# UTM-зона: null = определить по центроиду границы при подготовке города
utm_epsg: null

# Источники сырых данных.
# Городская выгрузка BBBike (81 МБ) вместо регионального Geofabrik (839 МБ):
# район помещается целиком, а качать и обрезать федеральный округ незачем.
# Если понадобится область за пределами выгрузки — есть
# https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf
sources:
  osm_pbf:
    url: "https://download.bbbike.org/osm/bbbike/Moscow/Moscow.osm.pbf"
    license: "ODbL 1.0, OpenStreetMap contributors"

# Заполняется после acquire: фактические пути, хеши и даты — в data_manifest.json
raw:
  osm_pbf: null
  population_raster: null

# Проверенный список поликлиник (п. 4.5) — заполняется после ручной проверки (Л9)
clinics_csv: null

# Необязательно: доля взрослых по муниципалитетам (Л11)
adult_share_csv: null
