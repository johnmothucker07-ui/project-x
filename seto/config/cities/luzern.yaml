# Люцерн — город для подэксперимента о разрешении снимка (docs/RESOLUTION_STUDY.md).
# В основной эксперимент НЕ входит: суждение модели о нужде в поликлинике
# зависит от застройки и системы здравоохранения, и швейцарский скор ничего
# не говорит о Москве. Здесь город сравнивается сам с собой на разных
# разрешениях, для этого страна не важна.

name: luzern
title: "Люцерн"
role: dev                    # dev | test | reserve

boundary:
  source: osm_relation
  relation_id: 1682891       # Luzern, город; bbox 8.207–8.428 E, 46.998–47.084 N
  admin_level: 8             # в Швейцарии город это Gemeinde

# Сетка строится в швейцарской проекции LV95, а НЕ в UTM.
# Причина: снимки swisstopo тоже в EPSG:2056. При совпадении проекций клетка
# остаётся осевым квадратом в системе снимка, и окно читается точно по её
# границам. В UTM квадрат клетки повернулся бы относительно растра, и пришлось
# бы делать лишнее перепроецирование — а контракт требует, чтобы снимок
# покрывал РОВНО ту территорию, по которой считаются признаки.
utm_epsg: 2056

sources:
  osm_pbf:
    url: "https://download.geofabrik.de/europe/switzerland-latest.osm.pbf"
    license: "ODbL 1.0, OpenStreetMap contributors"
  # Тайл GHS-POP, покрывающий город. Номер считается по координатам центроида
  # в проекции Mollweide; тайлов около 350, и выбор не того даёт пустое
  # население без явной ошибки — поэтому ссылка зафиксирована здесь.
  population_raster:
    url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_54009_100/V1-0/tiles/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R4_C19.zip"
    license: "CC BY 4.0, European Commission JRC (GHSL)"
  # Снимки не качаются целиком: это Cloud-Optimized GeoTIFF, окно под клетку
  # читается прямо по сети. Плитка 1 км² при 0,1 м весит 76 МБ, на город их
  # было бы около тридцати — незачем.
  imagery:
    stac: "https://data.geo.admin.ch/api/stac/v1/collections/ch.swisstopo.swissimage-dop10"
    gsd_m: 0.1
    # Швейцария снимается двумя чередующимися кампаниями, и на одной позиции
    # в каталоге лежат снимки разных лет. Год фиксируется: иначе сезон и
    # освещение попали бы в сравнение разрешений как посторонний источник
    # различий. 2024 покрывает все 208 клеток Люцерна.
    year: 2024
    crs: 2056
    license: "swisstopo, свободное использование; обязательна ссылка «©swisstopo»"
    attribution: "©swisstopo"
    terms: "https://www.swisstopo.admin.ch/en/terms-of-use-free-geodata-and-geoservices"

# Базовая сеть отбирается ТОЛЬКО по тегам OSM (amenity, healthcare из
# osm.clinic_tags), без фильтра по названию. Правила глобального конфига
# написаны под русские названия и в Швейцарии не работают: там нет слова
# «поликлиника», а есть Arztpraxis, Permanence, Gesundheitszentrum.
#
# Так можно, потому что здесь теги заполнены: в Западной Европе amenity и
# healthcare проставлены, в отличие от Москвы, где operator:type нашёлся у
# двух объектов из 1181 и выделять сеть пришлось по подстроке.
#
# Для подэксперимента этого достаточно: все четыре разрешения сравниваются
# при ОДНОЙ базовой сети, какой бы она ни была. На Москву швейцарское
# определение сети не переносится и не должно.
base_network:
  include: ""        # пустой шаблон совпадает с любым названием
  typical: ""        # поэтому и спорных случаев нет
  exclude: {}

# Застроенность считается по ВСЕМ зданиям, а не только по типизированным.
# В Люцерне тип указан у 6807 зданий из 25839 (26 %), в Москве — у 56 %.
# При правиле по умолчанию порог 5 % проходили 24 клетки из 208, а
# допустимыми оставались 6 — сравнивать размещения на шести точках
# бессмысленно. По built_share картина отражает реальную застройку.
feasible_site:
  min_built_area_share: 0.05
  built_from: ["built_share"]
  max_water_share: 0.5
  max_green_share: 0.5
  max_industrial_share: 0.5
  max_railway_share: 0.5
  max_cemetery_share: 0.5
  max_military_share: 0.5

raw:
  osm_pbf: null
  population_raster: null

clinics_csv: null
adult_share_csv: null
